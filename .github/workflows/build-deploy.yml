name: Build, Push & Deploy eShop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC login
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AKS_RESOURCE_GROUP: rg-observability
  AKS_CLUSTER_NAME: aks-obs-03
  NAMESPACE: eshop

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: catalog-api
            project: src/Catalog.API/Catalog.API.csproj
          - name: basket-api
            project: src/Basket.API/Basket.API.csproj
          - name: ordering-api
            project: src/Ordering.API/Ordering.API.csproj
          - name: webapp
            project: src/WebApp/WebApp.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          dotnet-quality: "preview"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: Build & push ${{ matrix.service.name }}
        run: |
          dotnet publish ${{ matrix.service.project }} \
            --os linux --arch x64 \
            /t:PublishContainer \
            /p:ContainerRegistry=${{ env.ACR_LOGIN_SERVER }} \
            /p:ContainerRepository=${{ matrix.service.name }} \
            /p:ContainerImageTag=${{ github.sha }}

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy eShop via Helm
        run: |
          helm upgrade --install eshop deploy/k8s/helm \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.tag=${{ github.sha }} \
            --wait --timeout 10m
